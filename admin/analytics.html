<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CornwallTap Analytics</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#eef9fa;color:#08213f}header{background:#00485a;color:white;padding:22px;text-align:center}header h1{margin:0;font-size:28px}header .tap{color:#18b8c3}header p{margin:6px 0 0;opacity:.85}main{width:min(1000px,calc(100% - 32px));margin:40px auto}.heading{margin-bottom:24px}.heading h2{margin:0 0 6px;font-size:26px}.heading p{margin:0;color:#58717a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(0,55,70,.08)}.label{color:#58717a;font-size:14px;font-weight:bold;margin-bottom:10px}.value{font-size:34px;font-weight:800;color:#00779b}.wide{grid-column:span 2}.status{margin-top:24px;font-size:13px;color:#71858b}.error{color:#a52626}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){main{margin-top:24px}.stats{grid-template-columns:1fr}.wide{grid-column:span 1}}
</style>
</head>
<body>
<header><h1>Cornwall<span class="tap">Tap</span> Analytics</h1><p>Game performance dashboard</p></header>
<main>
<div class="heading"><h2>Today</h2><p id="reportDate">Loading...</p></div>
<div class="stats">
<div class="card"><div class="label">Unique players</div><div class="value" id="players">—</div></div>
<div class="card"><div class="label">Games started</div><div class="value" id="started">—</div></div>
<div class="card"><div class="label">Games completed</div><div class="value" id="completed">—</div></div>
<div class="card"><div class="label">Completion rate</div><div class="value" id="completionRate">—</div></div>
<div class="card wide"><div class="label">Average Daily score</div><div class="value" id="averageScore">—</div></div>
<div class="card"><div class="label">Average game time</div><div class="value" id="averageTime">—</div></div>
<div class="card"><div class="label">Shares</div><div class="value" id="shares">—</div></div>
</div>
<div class="status" id="status">Loading analytics…</div>
</main>
<script>
function formatDuration(seconds){
 if(seconds===null||seconds===undefined)return "—";
 const mins=Math.floor(seconds/60); const secs=Math.round(seconds%60);
 return `${mins}m ${secs}s`;
}
async function loadAnalytics(){
 const status=document.getElementById("status");
 try{
  const response=await fetch("/api/analytics",{cache:"no-store"});
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  const data=await response.json();
  if(!data.ok) throw new Error(data.error||"Analytics request failed");
  const summary=data.summary;
  document.getElementById("reportDate").textContent=data.date;
  document.getElementById("players").textContent=summary.unique_players??0;
  document.getElementById("started").textContent=summary.games_started??0;
  document.getElementById("completed").textContent=summary.games_completed??0;
  document.getElementById("completionRate").textContent=`${summary.completion_rate??0}%`;
  document.getElementById("averageScore").textContent=summary.average_daily_score!==null?`${summary.average_daily_score} / 500`:"—";
  document.getElementById("averageTime").textContent=formatDuration(summary.average_duration_seconds);
  document.getElementById("shares").textContent=summary.shares??0;
  status.textContent="Live data from CornwallTap analytics.";
 }catch(error){
  console.error(error); status.textContent="Unable to load analytics."; status.classList.add("error");
 }
}
loadAnalytics();
</script>
</body>
</html>
